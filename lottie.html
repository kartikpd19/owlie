<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Owlie: edit and download</title>
    <style>
      :root { --ink: #151e52; --accent: #4b44d6; --line: #d9d5f7; --bg: #f4f2fb; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 40px 24px 64px; background: var(--bg); color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
      .wrap { max-width: 1080px; margin: 0 auto; }
      header { text-align: center; margin-bottom: 28px; }
      h1 { font-size: 28px; margin: 0 0 8px; }
      header p { margin: 0; opacity: .7; }
      header a { color: var(--accent); }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 10px; opacity: .6; }
      code { font-size: 12px; opacity: .65; }

      .panel { background: #fff; border-radius: 24px; padding: 24px; display: grid; gap: 28px;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
        box-shadow: 0 1px 2px rgb(21 30 82 / .06), 0 8px 24px rgb(21 30 82 / .06); }
      @media (max-width: 820px) { .panel { grid-template-columns: 1fr; } }

      #stage-wrap { border-radius: 16px; aspect-ratio: 480 / 352; display: grid; place-items: center; background: var(--bg); }
      #stage-wrap.checker { background: repeating-conic-gradient(#efedf7 0 25%, #fff 0 50%) 0 0 / 20px 20px; }
      #stage { width: 100%; height: 100%; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; justify-content: center; }
      .chip { font: inherit; font-size: 13px; font-weight: 600; text-transform: capitalize; cursor: pointer;
        padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
      .chip.is-active { background: var(--ink); border-color: var(--ink); color: #fff; }

      .controls { display: flex; flex-direction: column; gap: 22px; }
      .colors { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
      .color { display: flex; align-items: center; gap: 8px; font-size: 13px; }
      .color span { flex: 1; }
      .color input[type=color] { width: 30px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: none; cursor: pointer; }
      .color input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
      .color input[type=color]::-webkit-color-swatch { border: none; border-radius: 6px; }
      .color input[type=text] { width: 74px; font: 12px ui-monospace, monospace; padding: 6px 7px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); }
      .slider { display: flex; align-items: center; gap: 12px; font-size: 13px; }
      .slider input { flex: 1; accent-color: var(--accent); }
      #speed-value { width: 40px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
      .opts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; font-size: 13px; }
      .opts label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
      .opts input[type=radio] { accent-color: var(--accent); }
      #bg-color { width: 30px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; }
      #bg-color:disabled { opacity: .35; }
      select { font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; }
      .note { font-size: 12px; opacity: .6; margin-top: 6px; }

      .actions { display: flex; flex-wrap: wrap; gap: 10px; }
      .primary, .secondary { font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 999px; padding: 11px 18px; }
      .primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
      .primary:hover { filter: brightness(1.08); }
      .secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
      .secondary:hover { border-color: var(--ink); }
      button:disabled { opacity: .6; cursor: progress; }
      #selected { text-transform: capitalize; }

      .grid-title { text-align: center; margin: 44px 0 16px; }
      .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
      .card { background: #fff; border-radius: 20px; padding: 16px 16px 14px; width: 196px; text-align: center; cursor: pointer;
        border: 2px solid transparent; box-shadow: 0 1px 2px rgb(21 30 82 / .06), 0 8px 24px rgb(21 30 82 / .06); }
      .card.is-active { border-color: var(--accent); }
      .player { width: 164px; height: 120px; margin: 0 auto; }
      .card > code { display: block; margin-top: 4px; }
      .row { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
      .btn { font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1; color: var(--accent); background: #fff; cursor: pointer;
        padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; min-width: 52px; }
      .btn:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Owlie: edit and download</h1>
        <p>Change colours and speed, then download Lottie JSON or a GIF. <a href="./">See Owlie inline in headlines →</a></p>
      </header>

      <section class="panel">
        <div>
          <div id="stage-wrap"><div id="stage"></div></div>
          <div class="chips" id="chips"></div>
        </div>

        <div class="controls">
          <div>
            <h2>Colours</h2>
            <div class="colors" id="colors"></div>
          </div>
          <div>
            <h2>Speed</h2>
            <div class="slider">
              <span>0.5×</span>
              <input id="speed" type="range" min="0.5" max="2" step="0.05" />
              <span>2×</span>
              <span id="speed-value"></span>
            </div>
          </div>
          <div>
            <h2>GIF options</h2>
            <div class="opts">
              <label><input type="radio" name="bg" value="transparent" /> Transparent</label>
              <label><input type="radio" name="bg" value="solid" /> Solid background</label>
              <input id="bg-color" type="color" value="#f4f2fb" aria-label="GIF background colour" />
              <select id="size" aria-label="GIF size">
                <option value="1">Full size</option>
                <option value="0.5">Half size</option>
              </select>
            </div>
            <p class="note" id="size-note"></p>
          </div>
          <div class="actions">
            <button class="primary" id="dl-json">Download <span id="selected"></span> JSON</button>
            <button class="primary" id="dl-gif">Download GIF</button>
            <button class="secondary" id="reset">Reset</button>
            <button class="secondary" id="copy-link">Copy link</button>
          </div>
        </div>
      </section>

      <h2 class="grid-title">All expressions · downloads include your edits</h2>
      <div class="grid" id="grid"></div>
    </div>
    <script type="module" src="/src/lottie-preview.ts"></script>
  </body>
</html>
