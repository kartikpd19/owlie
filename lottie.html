<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Owlie: Lottie JSON preview</title>
    <style>
      body { margin: 0; padding: 48px 24px; background: #f4f2fb; color: #151e52;
        font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif; text-align: center; }
      h1 { font-size: 28px; margin: 0 0 8px; }
      p { margin: 0 0 32px; opacity: .7; }
      .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
      .card { background: #fff; border-radius: 20px; padding: 16px 16px 14px; width: 220px;
        box-shadow: 0 1px 2px rgb(21 30 82 / .06), 0 8px 24px rgb(21 30 82 / .06); }
      .player { width: 188px; height: 138px; }
      code { font-size: 12px; opacity: .65; }
      .row { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 6px; }
      .card > code { display: block; margin-top: 4px; }
      .row { margin-top: 10px; }
      .btn { font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1; color: #4b44d6; text-decoration: none; padding: 7px 12px;
        border: 1px solid #d9d5f7; border-radius: 999px; }
      .btn:hover { background: #4b44d6; color: #fff; border-color: #4b44d6; }
    </style>
  </head>
  <body>
    <h1>Owlie Lottie files</h1>
    <p>Each card plays <code>lottie/owlie-&lt;expression&gt;.json</code> in lottie-web. Download it as Lottie JSON or as a GIF.</p>
    <div class="grid" id="grid"></div>
    <script type="module" src="/src/lottie-preview.ts"></script>
  </body>
</html>
